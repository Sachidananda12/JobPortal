<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <!-- Bootstrap CSS (optional, for styling) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm rounded-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Edit Profile</h4>

            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" value="{{ profile.full_name }}" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" value="{{ profile.phone }}" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-control">
                  <option value="male" {% if profile.gender == "male" %}selected{% endif %}>Male</option>
                  <option value="female" {% if profile.gender == "female" %}selected{% endif %}>Female</option>
                  <option value="other" {% if profile.gender == "other" %}selected{% endif %}>Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Job Profile</label>
                <input type="text" name="job_profile" value="{{ profile.job_profile }}" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Headline</label>
                <input type="text" name="headline" value="{{ profile.headline }}" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Profile Picture</label>
                <input type="file" name="image" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Resume (PDF/DOC)</label>
                <input type="file" name="resume" class="form-control">
              </div>

              <button type="submit" class="btn btn-success">Save Changes</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (optional, for form styling/alerts) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
